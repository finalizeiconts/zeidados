# Reconstrói o site e atualiza a branch `hostinger` (a que a Hostinger clona).
# As variáveis VITE_* são públicas por design (vão no bundle do navegador).
name: Deploy Hostinger

on:
  push:
    branches:
      - main
      - claude/financial-bi-dashboard-realtime-8rjf68
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ehrdmbbqvkxejgtkpbjb.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocmRtYmJxdmt4ZWpndGtwYmpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzMyMjksImV4cCI6MjA5MTQwOTIyOX0.TbVqlKMJcz_odToYM_Wr_UrGLCrscHtuR0XfClPp39k
          VITE_CA_CONNECT_URL: https://ehrdmbbqvkxejgtkpbjb.supabase.co/functions/v1/ca-auth-start

      - name: Publica dist na branch hostinger
        run: |
          cd dist
          git init -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hostinger
